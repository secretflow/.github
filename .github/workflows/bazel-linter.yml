---
name: Bazel files linter
on:
  workflow_call:
jobs:
  formatting-check:
    name: Run buildifier check
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Run buildifier
        uses: jbajic/buildifier@c9f11065442c33bc0a9a54fd17b934266360d762 # v1.0.1
        with:
          buildifier-version: 7.3.1
